name: publication-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools-mit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # For pull requests, test the pushed head commit, not GitHub's synthetic
          # merge commit, whose author is the account's primary email address.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # reviewed official commit
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install without package downloads
        shell: bash
        run: |
          python -B tools/build_wheel.py "$RUNNER_TEMP/wheels"
          python -m pip install --no-index --no-deps "$RUNNER_TEMP/wheels/xenstride-0.1.0-py3-none-any.whl"
      - name: Test installed package with synthetic inputs only
        run: python -I -B -m unittest discover -s tests -v
      - name: Inspect complete publication and repository history
        working-directory: .
        run: python -B scripts/check_publication.py --require-history
  runtime:
    # GPL runtime: locked build and the library suite. Tests use WARP (no GPU on the runner).
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Rust 1.100.0 (MSVC)
        run: rustup toolchain install 1.100.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Build the workspace (exact Cargo.lock)
        run: cargo +1.100.0 build --workspace --release --locked
      - name: Library suite on WARP
        run: cargo +1.100.0 test -p xcl --release --locked --lib
