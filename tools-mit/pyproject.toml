[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xenstride"
version = "0.1.0"
description = "Bounded static binary-format research tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
